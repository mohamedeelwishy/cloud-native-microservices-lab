{{- range $name, $svc := .Values.services }}
{{- if ne ($svc.enabled | toString) "false" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
        - name: server
          {{- if eq ($svc.useCustomRegistry | toString) "false" }}
          image: "{{ $svc.image }}:{{ $svc.tag }}"
          {{- else }}
          image: "{{ $.Values.imageRegistry }}/{{ $name }}:{{ $svc.tag }}"
          {{- end }}
          imagePullPolicy: {{ $.Values.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          env:
            {{- range $k, $v := $.Values.globalEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
{{- end }}
{{- end }}
