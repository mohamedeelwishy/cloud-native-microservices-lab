imageRegistry: wishivic
pullPolicy: IfNotPresent

# Global environment variables injected into services to disable GCP-specific telemetry
globalEnv:
  DISABLE_TRACING: "1"
  DISABLE_PROFILER: "1"
  DISABLE_STATS: "1"

services:
  redis-cart:
    image: redis
    tag: alpine
    useCustomRegistry: false
    port: 6379
    replicas: 1

  adservice:
    tag: latest
    port: 9555
    replicas: 1
    env:
      PORT: "9555"

  cartservice:
    tag: latest
    port: 7070
    replicas: 1
    env:
      REDIS_ADDR: "redis-cart:6379"

  checkoutservice:
    tag: latest
    port: 5050
    replicas: 1
    env:
      PORT: "5050"
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      SHIPPING_SERVICE_ADDR: "shippingservice:50051"
      PAYMENT_SERVICE_ADDR: "paymentservice:50051"
      EMAIL_SERVICE_ADDR: "emailservice:8080"
      CURRENCY_SERVICE_ADDR: "currencyservice:7000"
      CART_SERVICE_ADDR: "cartservice:7070"

  currencyservice:
    tag: latest
    port: 7000
    replicas: 1
    env:
      PORT: "7000"

  emailservice:
    tag: latest
    port: 8080
    replicas: 1
    env:
      PORT: "8080"

  paymentservice:
    tag: latest
    port: 50051
    replicas: 1
    env:
      PORT: "50051"

  productcatalogservice:
    tag: latest
    port: 3550
    replicas: 1
    env:
      PORT: "3550"

  recommendationservice:
    tag: latest
    port: 8080
    replicas: 1
    env:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"

  shippingservice:
    tag: latest
    port: 50051
    replicas: 1
    env:
      PORT: "50051"

  frontend:
    tag: latest
    port: 8080
    replicas: 1
    serviceType: NodePort
    env:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      CURRENCY_SERVICE_ADDR: "currencyservice:7000"
      CART_SERVICE_ADDR: "cartservice:7070"
      RECOMMENDATION_SERVICE_ADDR: "recommendationservice:8080"
      SHIPPING_SERVICE_ADDR: "shippingservice:50051"
      CHECKOUT_SERVICE_ADDR: "checkoutservice:5050"
      AD_SERVICE_ADDR: "adservice:9555"

  loadgenerator:
    enabled: false
    tag: latest
    port: 8089
    replicas: 1
    env:
      FRONTEND_ADDR: "frontend:8080"
      USERS: "10"
