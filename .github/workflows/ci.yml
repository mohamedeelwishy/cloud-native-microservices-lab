name: Build and Push Microservices

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'           # Trigger only when changes occur inside service source directories
  workflow_dispatch:       # Manual trigger to build all 11 services on the initial run

jobs:
  # 1. Detect which microservices have changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            adservice:
              - 'src/adservice/**'
            cartservice:
              - 'src/cartservice/**'
            checkoutservice:
              - 'src/checkoutservice/**'
            currencyservice:
              - 'src/currencyservice/**'
            emailservice:
              - 'src/emailservice/**'
            frontend:
              - 'src/frontend/**'
            loadgenerator:
              - 'src/loadgenerator/**'
            paymentservice:
              - 'src/paymentservice/**'
            productcatalogservice:
              - 'src/productcatalogservice/**'
            recommendationservice:
              - 'src/recommendationservice/**'
            shippingservice:
              - 'src/shippingservice/**'

  # 2. Build and push Docker images only for modified services
  build-and-push:
    needs: detect-changes
    # Run if at least one service changed or if triggered manually
    if: ${{ needs.detect-changes.outputs.services != '[]' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Build all services on manual dispatch, otherwise build only changed ones
        service: ${{ github.event_name == 'workflow_dispatch' && fromJson('["adservice","cartservice","checkoutservice","currencyservice","emailservice","frontend","loadgenerator","paymentservice","productcatalogservice","recommendationservice","shippingservice"]') || fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set build context path
        id: path
        run: |
          # Handle cartservice exception since its Dockerfile is located inside src/cartservice/src
          if [ "${{ matrix.service }}" == "cartservice" ]; then
            echo "context=./src/cartservice/src" >> $GITHUB_OUTPUT
          else
            echo "context=./src/${{ matrix.service }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.path.outputs.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
