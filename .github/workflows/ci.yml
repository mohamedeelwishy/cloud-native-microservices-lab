name: Build and Push Microservices

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Detect which microservices have changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            adservice:
              - 'src/adservice/**'
            cartservice:
              - 'src/cartservice/**'
            checkoutservice:
              - 'src/checkoutservice/**'
            currencyservice:
              - 'src/currencyservice/**'
            emailservice:
              - 'src/emailservice/**'
            frontend:
              - 'src/frontend/**'
            loadgenerator:
              - 'src/loadgenerator/**'
            paymentservice:
              - 'src/paymentservice/**'
            productcatalogservice:
              - 'src/productcatalogservice/**'
            recommendationservice:
              - 'src/recommendationservice/**'
            shippingservice:
              - 'src/shippingservice/**'

  # 2. Build and push Docker images only for modified services
  build-and-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ github.event_name == 'workflow_dispatch' && fromJson('["adservice","cartservice","checkoutservice","currencyservice","emailservice","frontend","loadgenerator","paymentservice","productcatalogservice","recommendationservice","shippingservice"]') || fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set build context path
        id: path
        run: |
          if [ "${{ matrix.service }}" == "cartservice" ]; then
            echo "context=./src/cartservice/src" >> $GITHUB_OUTPUT
          else
            echo "context=./src/${{ matrix.service }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.path.outputs.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest

  # 3. Update Helm values.yaml with the new immutable SHA tag
  update-helm-values:
    needs: [detect-changes, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update image tags in values.yaml
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            SERVICES='["adservice","cartservice","checkoutservice","currencyservice","emailservice","frontend","loadgenerator","paymentservice","productcatalogservice","recommendationservice","shippingservice"]'
          else
            SERVICES='${{ needs.detect-changes.outputs.services }}'
          fi

          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            yq -i ".services.${svc}.tag = \"${{ github.sha }}\"" helm/online-boutique/values.yaml
          done

      - name: Commit and push updated values.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/online-boutique/values.yaml
          git diff --staged --quiet || (git commit -m "chore(gitops): update image tags to ${{ github.sha }}" && git push)
